name: urban-company-rebook-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: uc_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urban_company_rebook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urban_company_rebook}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - uc_dev_network

  backend:
    image: node:20-alpine
    container_name: uc_backend_dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-urban_company_rebook}?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-urban-company-rebook-jwt-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache openssl &&
             npm install &&
             npx prisma generate &&
             npx prisma db push --skip-generate &&
             npm run dev"
    networks:
      - uc_dev_network

  frontend:
    image: node:20-alpine
    container_name: uc_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - uc_dev_network

networks:
  uc_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
