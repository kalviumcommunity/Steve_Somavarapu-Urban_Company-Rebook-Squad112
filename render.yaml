services:
  - type: web
    name: urban-company-rebook-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: urban-company-rebook-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: urban-company-rebook-db
    databaseName: urban_company_rebook
    user: postgres
    plan: free
